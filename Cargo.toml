[workspace]
resolver = "2"
members = ["crates/core", "crates/windows", "crates/waybar"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Bagansio/claude-quota-taskbar"

[workspace.dependencies]
claude-quota-core = { path = "crates/core" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
